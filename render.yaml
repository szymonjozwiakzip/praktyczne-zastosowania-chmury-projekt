services:
  - type: web
    name: zapisy-wydarzenia
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: zapisy-db
          property: connectionString

databases:
  - name: zapisy-db
    plan: basic-256mb
    region: frankfurt
    databaseName: zapisy
    user: zapisy
